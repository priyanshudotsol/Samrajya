<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Samrajya: a gold crown over two crossed talwars, on the "royal night" ink with a gold hairline -->
  <defs>
    <radialGradient id="ink" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#3a2614"/>
      <stop offset="1" stop-color="#120c08"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe69a"/>
      <stop offset="0.55" stop-color="#e3b341"/>
      <stop offset="1" stop-color="#a87414"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4efe4"/>
      <stop offset="1" stop-color="#9a9488"/>
    </linearGradient>
  </defs>

  <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="url(#ink)" stroke="#c9a227" stroke-width="2"/>

  <!-- crossed talwars (curved blades, gold hilts) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 52 Q 30 40 50 14" fill="none" stroke="url(#steel)" stroke-width="3.6"/>
    <path d="M50 52 Q 34 40 14 14" fill="none" stroke="url(#steel)" stroke-width="3.6"/>
    <path d="M10.5 47.5 L 18.5 55.5" stroke="url(#gold)" stroke-width="3.2"/>
    <path d="M53.5 47.5 L 45.5 55.5" stroke="url(#gold)" stroke-width="3.2"/>
    <circle cx="11" cy="56" r="2.3" fill="url(#gold)"/>
    <circle cx="53" cy="56" r="2.3" fill="url(#gold)"/>
  </g>

  <!-- the crown -->
  <path d="M16 41 L 13 22 L 23.5 30 L 32 16 L 40.5 30 L 51 22 L 48 41 Z"
        fill="url(#gold)" stroke="#5a3b0c" stroke-width="1.6" stroke-linejoin="round"/>
  <rect x="15.5" y="40" width="33" height="6" rx="1.6" fill="url(#gold)" stroke="#5a3b0c" stroke-width="1.6"/>
  <circle cx="13" cy="21" r="2.6" fill="url(#gold)" stroke="#5a3b0c" stroke-width="1.2"/>
  <circle cx="32" cy="14.5" r="2.9" fill="url(#gold)" stroke="#5a3b0c" stroke-width="1.2"/>
  <circle cx="51" cy="21" r="2.6" fill="url(#gold)" stroke="#5a3b0c" stroke-width="1.2"/>
  <!-- jewels -->
  <path d="M32 27.5 L 35.2 33 L 32 38.5 L 28.8 33 Z" fill="#d2392c" stroke="#6e130c" stroke-width="1"/>
  <circle cx="24" cy="43" r="1.5" fill="#d2392c"/>
  <circle cx="32" cy="43" r="1.5" fill="#14a37f"/>
  <circle cx="40" cy="43" r="1.5" fill="#d2392c"/>
</svg>
