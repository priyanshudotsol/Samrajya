[workspace]
members = [
    "programs/*"
]
resolver = "2"

[profile.release]
overflow-checks = true
# Smaller binary = cheaper deploy (rent scales with program size).
opt-level = "z"
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# Keep host test builds small (the disk on this machine is nearly full).
[profile.dev]
debug = false
[profile.test]
debug = false
